<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Building Form - Smart Parking</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app-layout"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="main-content">
<div class="page-header"><div><h1 th:text="${building != null ? '✏️ Edit Building' : '➕ Add Building'}">Add Building</h1></div><a th:href="@{/manager/buildings}" class="btn btn-outline">← Back</a></div>
<div class="card" style="max-width:600px">
<form th:action="@{/manager/buildings/save}" method="post">
<input type="hidden" name="id" th:value="${building?.id}">
<div class="form-group"><label>Building Name</label><input type="text" name="buildingName" class="form-control" th:value="${building?.buildingName}" required></div>
<div class="form-group"><label>Address</label><input type="text" name="address" class="form-control" th:value="${building?.address}" required></div>
<div class="form-group"><label>Total Floors</label><input type="number" name="totalFloors" class="form-control" th:value="${building?.totalFloors}" min="1" required></div>
<div class="form-group"><label>Operating Start Time</label><input type="time" name="operatingStartTime" class="form-control" th:value="${building?.operatingStartTime}" required></div>
<div class="form-group"><label>Operating End Time</label><input type="time" name="operatingEndTime" class="form-control" th:value="${building?.operatingEndTime}" required></div>
<button type="submit" class="btn btn-primary btn-block">💾 Save Building</button>
</form></div></main></div></body></html>
