<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reservations</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app-layout"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="main-content">
<div class="page-header"><div><h1>📋 Reservations</h1><p>Manage parking reservations</p></div><a th:href="@{/staff/reservations/create}" class="btn btn-primary">➕ New Reservation</a></div>
<div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
<div class="card"><div class="table-container"><table><thead><tr><th>User</th><th>Vehicle Type</th><th>Slot</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="r : ${reservations}"><td th:text="${r.userName}"></td><td th:text="${r.vehicleTypeName}"></td><td th:text="${r.slotCode}"></td>
<td><span class="badge" th:classappend="'badge-'+${r.status?.toLowerCase()}" th:text="${r.status}"></span></td>
<td><div class="btn-group">
<a th:if="${r.status == 'CONFIRMED'}" th:href="@{/staff/reservations/cancel/{id}(id=${r.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Cancel?')">❌</a>
<a th:href="@{/staff/reservations/delete/{id}(id=${r.id})}" class="btn btn-outline btn-sm" onclick="return confirm('Delete?')">🗑️</a>
</div></td></tr></tbody></table></div></div></main></div></body></html>
