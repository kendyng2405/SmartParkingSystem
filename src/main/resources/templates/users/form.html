<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Form</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app-layout"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="main-content">
<div class="page-header"><div><h1 th:text="${user != null ? '✏️ Edit User' : '➕ Add User'}">Add</h1></div><a th:href="@{/admin/users}" class="btn btn-outline">← Back</a></div>
<div class="card" style="max-width:600px"><form th:action="@{/admin/users/save}" method="post">
<input type="hidden" name="id" th:value="${user?.id}">
<div class="form-group"><label>Full Name</label><input type="text" name="fullName" class="form-control" th:value="${user?.fullName}" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" th:value="${user?.email}" required></div>
<div class="form-group"><label>Phone</label><input type="tel" name="phoneNumber" class="form-control" th:value="${user?.phoneNumber}"></div>
<div class="form-group"><label>Role</label><select name="roleName" class="form-control" required>
<option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${user != null && user.roleName == r}"></option></select></div>
<div class="form-group"><label th:text="${user != null ? 'New Password (leave blank to keep)' : 'Password'}">Password</label>
<input type="password" name="password" class="form-control" th:required="${user == null}"></div>
<button type="submit" class="btn btn-primary btn-block">💾 Save User</button>
</form></div></main></div></body></html>
