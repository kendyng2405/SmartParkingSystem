<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Parking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">🅿️</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join Smart Parking System</p>
        <div th:if="${error}" class="alert alert-error">⚠️ <span th:text="${error}"></span></div>
        <form th:action="@{/register}" method="post">
            <div class="form-group"><label>Full Name</label><input type="text" name="fullName" class="form-control" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" name="phoneNumber" class="form-control" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
            <div class="form-group"><label>Role</label>
                <select name="role" class="form-control">
                    <option value="DRIVER">Driver</option>
                    <option value="STAFF">Parking Staff</option>
                    <option value="MANAGER">Parking Manager</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success btn-block">✨ Create Account</button>
        </form>
        <p style="text-align:center;margin-top:20px;color:var(--text-secondary);font-size:14px">
            Already have an account? <a th:href="@{/login}" style="color:var(--accent-blue);text-decoration:none;font-weight:600">Sign In</a>
        </p>
    </div>
</div>
</body>
</html>
