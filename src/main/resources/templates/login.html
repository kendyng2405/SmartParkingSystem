<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Parking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">🅿️</div>
        <h1>Smart Parking</h1>
        <p class="subtitle">Building Management System</p>

        <div th:if="${error}" class="alert alert-error">⚠️ <span th:text="${error}"></span></div>
        <div th:if="${message}" class="alert alert-success">✅ <span th:text="${message}"></span></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">🔐 Sign In</button>
        </form>
        <p style="text-align:center;margin-top:20px;color:var(--text-secondary);font-size:14px">
            Don't have an account? <a th:href="@{/register}" style="color:var(--accent-blue);text-decoration:none;font-weight:600">Register</a>
        </p>
        <div style="margin-top:24px;padding-top:20px;border-top:var(--border);font-size:12px;color:var(--text-secondary)">
            <p style="margin-bottom:8px;font-weight:600">Demo Accounts:</p>
            <p>👨‍💼 admin@parking.com / admin123</p>
            <p>👔 manager@parking.com / manager123</p>
            <p>👷 staff@parking.com / staff123</p>
            <p>🚗 driver@parking.com / driver123</p>
        </div>
    </div>
</div>
</body>
</html>
