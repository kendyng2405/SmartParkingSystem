<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Report Incident</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app-layout"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="main-content">
<div class="page-header"><div><h1>➕ Report Incident</h1></div><a th:href="@{/staff/incidents}" class="btn btn-outline">← Back</a></div>
<div class="card" style="max-width:600px"><form th:action="@{/staff/incidents/save}" method="post">
<div class="form-group"><label>Related Session (Optional)</label><select name="sessionId" class="form-control">
<option value="">None</option><option th:each="s : ${sessions}" th:value="${s.id}" th:text="${s.licensePlate}+' - '+${s.slotCode}"></option></select></div>
<div class="form-group"><label>Incident Type</label><select name="incidentType" class="form-control" required>
<option value="LOST_TICKET">🎫 Lost Ticket</option><option value="WRONG_LICENSE_PLATE">🔢 Wrong License Plate</option>
<option value="OVERTIME">⏰ Overtime</option><option value="WRONG_ZONE">📍 Wrong Zone</option>
<option value="UNPAID">💸 Unpaid</option><option value="SLOT_OCCUPIED">🅿️ Slot Occupied</option><option value="OTHER">📝 Other</option></select></div>
<div class="form-group"><label>Description</label><textarea name="description" class="form-control" rows="4" required placeholder="Describe the incident..."></textarea></div>
<button type="submit" class="btn btn-danger btn-block">⚠️ Submit Report</button>
</form></div></main></div></body></html>
