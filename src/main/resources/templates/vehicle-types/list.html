<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vehicle Types</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app-layout"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="main-content">
<div class="page-header"><div><h1>🚗 Vehicle Types</h1><p>Manage vehicle categories</p></div><a th:href="@{/manager/vehicle-types/create}" class="btn btn-primary">➕ Add Type</a></div>
<div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
<div class="card"><div class="table-container"><table><thead><tr><th>Type Name</th><th>Description</th><th>Actions</th></tr></thead><tbody>
<tr th:each="vt : ${vehicleTypes}"><td><strong th:text="${vt.typeName}"></strong></td><td th:text="${vt.description}"></td>
<td><div class="btn-group"><a th:href="@{/manager/vehicle-types/edit/{id}(id=${vt.id})}" class="btn btn-outline btn-sm">✏️</a><a th:href="@{/manager/vehicle-types/delete/{id}(id=${vt.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Delete?')">🗑️</a></div></td></tr>
</tbody></table></div></div></main></div></body></html>
